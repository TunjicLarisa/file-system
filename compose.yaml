services:
  app:
    build:
      context: .

    ports:
      - "8000:8000"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/storage/app/database.sqlite

      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync

    volumes:
      - sqlite-data:/var/www/storage/app

volumes:
  sqlite-data: